<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RollerKey 3">
<meta name="theme-color" content="#000000">
<title>RollerKey 3</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#000;--card:#040b06;--line:#0e3d22;--txt:#4dff92;--dim:#2b8555;--acc:#00ff6a;--warn:#ffd400;--bad:#ff4d4d;--sb:env(safe-area-inset-bottom,0px)}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:17px/1.5 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;overflow:hidden}
  header{padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  h1{font-size:19px;margin:0;letter-spacing:2px;color:var(--acc)}
  .led{width:10px;height:10px;border-radius:50%;background:#3a1010;display:inline-block;margin-right:8px}
  .led.on{background:var(--acc);box-shadow:0 0 12px var(--acc)}
  main{flex:1;overflow-y:auto;padding:16px 16px calc(40px + var(--sb))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .big{font-size:20px;font-weight:700;padding:22px;border-radius:16px;border:2px solid var(--acc);background:var(--acc);color:#001b0b;width:100%;font-family:inherit;letter-spacing:1px;margin-bottom:10px}
  .big:disabled{opacity:.3}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .s{font-size:14px;padding:15px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--acc);font-family:inherit;font-weight:700}
  .s:disabled{opacity:.28}
  .s.red{color:var(--bad);border-color:#4d1414}
  .stat{font-size:14px;font-weight:700;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:12px;color:var(--dim)}
  .stat.ok{color:var(--acc);border-color:#0e5c33;background:#00170c}
  .stat.warn{color:var(--warn);border-color:#5c4a0e;background:#171200}
  .stat.bad{color:var(--bad);border-color:#5c1414;background:#170000}
  .wrap{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;margin-bottom:12px;border:1px solid var(--line);display:none}
  .wrap.on{display:block}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .wrap::after{content:"";position:absolute;inset:15% 10%;border:2px solid var(--acc);border-radius:16px;pointer-events:none}
  .t{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc);letter-spacing:-1px}
  pre{background:#000;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:11px;overflow:auto;max-height:190px;color:var(--txt);white-space:pre-wrap}
  details{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card);margin-bottom:12px}
  summary{cursor:pointer;font-size:12px;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase}
  details[open] summary{margin-bottom:12px;color:var(--acc)}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#000;color:var(--txt);font:inherit;font-size:14px;margin-bottom:8px}
  .lbl{font-size:11px;color:var(--dim);display:block;margin:6px 0 4px}
  p{margin:0 0 10px;color:var(--dim);font-size:13px}
  .pin{font-size:12px;color:var(--warn);margin-bottom:10px}
  .row{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:8px}
  label.cb{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--txt);margin:4px 0 10px}
  label.cb input{width:auto;margin:0;transform:scale(1.3)}
</style>
</head>
<body>
<header><h1>ROLLERKEY 3</h1><span><span class="led" id="led"></span><span style="font-size:12px;color:var(--dim)" id="state">BEREIT</span></span></header>

<main>
  <div id="status" class="stat">Drück den Knopf, dann scan den QR-Code.</div>
  <div class="pin" id="pin">Kopplungscode falls gefragt: <b>000000</b> · sonst <b>123456</b></div>
  <div class="wrap" id="camBox"><video id="vid" playsinline muted autoplay></video></div>
  <button class="big" id="go">VERBINDEN &amp; SCANNEN</button>

  <div class="card">
    <div class="grid">
      <button class="s" id="again" disabled>Nochmal entsperren</button>
      <button class="s red" id="lock" disabled>Sperren</button>
      <button class="s" id="lon" disabled>Licht an</button>
      <button class="s" id="loff" disabled>Licht aus</button>
    </div>
    <div class="row"><span>Antworten: <b id="acks">0</b></span><span>Kanal: <b id="chan">–</b></span></div>
  </div>

  <div class="card"><div class="t" id="timer">00:00</div></div>

  <details>
    <summary>Konsole</summary>
    <pre id="log">bereit.</pre>
  </details>

  <details>
    <summary>Konto &amp; Trick</summary>
    <label class="cb"><input type="checkbox" id="free"> Nur kostenlos (Serverfahrt aus)</label>
    <p>Konto wird automatisch angelegt. Reservieren ist gratis und macht den Roller aufnahmefähiger.</p>
    <div class="row" style="margin:0 0 8px"><span>Guthaben: <b id="bal">–</b></span><span id="accTag">kein Konto</span></div>
    <label class="lbl">Proxy-URL</label>
    <input id="proxy" placeholder="https://proxy.dein-name.workers.dev">
    <button class="s" id="save" style="width:100%;margin-bottom:8px">Speichern</button>
    <button class="s" id="mkacc" style="width:100%;margin-bottom:8px">Konto neu anlegen</button>
    <button class="s" id="resv" style="width:100%;margin-bottom:8px">Nächsten Roller reservieren</button>
    <button class="s" id="cancel" style="width:100%;margin-bottom:8px">Reservierung aufheben</button>
    <button class="s" id="chk" style="width:100%">Guthaben prüfen</button>
    <label class="lbl">Pause (ms)</label>
    <input id="delay" inputmode="numeric">
    <button class="s" id="saveDelay" style="width:100%">Pause speichern</button>
    <pre id="accLog" style="margin-top:10px">–</pre>
  </details>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const get=(k,d)=>localStorage.getItem("sf_"+k)??d;
const set=(k,v)=>localStorage.setItem("sf_"+k,v);
const err=e=>{ if(!e)return "unbekannt"; if(typeof e==="string")return e; return e.message||e.name||JSON.stringify(e).slice(0,110)||"unbekannt" };
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const uuid=()=>crypto.randomUUID();

const CANDS=[0xffe0,0xffe1,0xfff0,0xff00,0xffb0,0xffe5,0xfe59,0xffa0,0xfff1,0xfff2];
const U=n=>"0000"+n.toString(16).padStart(4,"0")+"-0000-1000-8000-00805f9b34fb";
const FRAMES=[c=>c,c=>c+"\r",c=>c+"\n",c=>c+"\r\n",c=>"*"+c+"#"];
const VOCAB=["WS","US","KS","MS","K1","K0","M1","M0","UN","UL","U1","RS","ST","ON","OF","1","2","A","E"];
const UNLOCK="WS,US,KS";
const MAIL="https://www.1secmail.com/api/v1/";
const BASE="https://web-production.lime.bike/api/rider";

let dev=null,chans=[],ci=0,stream=null,raf=null,tick=null,t0=null,busy=false,acks=0,last="",lastT=0,ride=null,pending=null,recon=0;
let reserved=null,bound=false;
const vid=$("#vid"),cv=document.createElement("canvas"),ctx=cv.getContext("2d",{willReadFrequently:true});
const log=t=>{const p=$("#log");p.textContent+="\n["+new Date().toLocaleTimeString("de-DE",{hour12:false})+"] "+t;p.scrollTop=p.scrollHeight};
const stat=(t,c)=>{const s=$("#status");s.textContent=t;s.className="stat "+(c||"")};
const DLY=()=>Math.max(150,parseInt(get("delay","700"),10)||700);
const H=()=>({
  authorization:"Bearer "+get("lime",""),
  "content-type":"application/json",
  platform:"iOS","app-version":"3.248.1","x-device-token":get("dev",""),
  "accept-language":"de-DE","accept":"application/json"
});
const geo=()=>new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),rej,{timeout:8000}));
const online=()=>navigator.onLine&&!!get("proxy","");
const onlyFree=()=>get("free","1")==="1";

function ui(){
  const on=chans.length>0;
  $("#state").textContent=ride?"FAHRT":(on?"VERBUNDEN":"BEREIT");
  $("#led").classList.toggle("on",on||!!ride);
  ["#again","#lock","#lon","#loff"].forEach(s=>$(s).disabled=!on||busy);
  ["#resv","#cancel","#mkacc","#chk"].forEach(s=>$(s).disabled=busy);
  $("#go").disabled=busy;
  $("#chan").textContent=on&&chans[ci]?chans[ci].uuid.slice(4,8):"–";
  $("#accTag").textContent=get("lime","")?"Konto aktiv":"kein Konto";
}

async function api(url,opt={}){
  const p=get("proxy","");
  if(!p) throw new Error("Proxy-URL fehlt");
  const r=await fetch(p+"?u="+encodeURIComponent(url),{
    method:opt.method||"GET",headers:opt.headers||{},
    body:opt.body?JSON.stringify(opt.body):undefined});
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(_){j=t}
  return {status:r.status,data:j};
}

let q=Promise.resolve();
function write(cmd,frameFn){
  q=q.then(async()=>{
    const c=chans[ci]; if(!c) return false;
    const raw=frameFn?frameFn(cmd):cmd;
    try{
      const d=new TextEncoder().encode(raw);
      if(c.properties.writeWithoutResponse) await c.writeValueWithoutResponse(d);
      else await c.writeValue(d);
      log("→ "+JSON.stringify(raw)); return true;
    }catch(e){ log("Senden: "+err(e)); return false }
  },()=>{});
  return q;
}
async function fullSeq(cmds,frameFn,pause){
  for(const c of String(cmds).split(",")){
    const v=c.trim(); if(!v) continue;
    await write(v,frameFn); await wait(pause);
  }
  return acks>0;
}

/* ---------- Verbindung ---------- */
async function waitChannels(ms){
  const end=Date.now()+ms;
  while(Date.now()<end){
    try{
      const srv=await dev.gatt.connect();
      const out=[];
      for(const s of CANDS.map(U)){
        try{
          (await (await srv.getPrimaryService(s)).getCharacteristics()).forEach(c=>{
            if(c.properties.write||c.properties.writeWithoutResponse) out.push(c);
          });
        }catch(_){}
      }
      if(out.length) return out;
    }catch(_){}
    await wait(800);
  }
  return [];
}
async function connectDevice(){
  for(let a=1;a<=6;a++){
    try{
      if(!dev.gatt.connected) await dev.gatt.connect();
      const got=await waitChannels(a===1?25000:8000);
      if(got.length) return got;
    }catch(e){ log("Versuch "+a+": "+err(e)) }
    await wait(1200);
  }
  return [];
}
function attach(list){
  chans=list; ci=0; recon=0;
  chans.forEach(c=>{
    if(!c.properties.notify) return;
    c.startNotifications().then(()=>{
      c.addEventListener("characteristicvaluechanged",e=>{
        acks++; $("#acks").textContent=acks;
        log("← "+new TextDecoder().decode(e.target.value));
      });
    }).catch(()=>{});
  });
  ui();
}
async function startLink(){
  if(!navigator.bluetooth) return stat("Kein Bluetooth. Bluefy nutzen.","bad");
  try{ dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:CANDS.map(U)}) }
  catch(e){ stat("Suche: "+err(e),"bad"); log("Suche: "+err(e)); return }
  log("Gerät: "+(dev.name||"(namenlos)"));
  if(!bound){
    bound=true;
    dev.addEventListener("gattserverdisconnected",async()=>{
      chans=[]; ui();
      if(recon>=8){ stat("Verbindung weg.","bad"); return }
      recon++;
      stat("Neu verbinden "+recon+"/8 …","warn");
      const got=await connectDevice();
      if(got.length){ attach(got); stat("Wieder verbunden.","ok") }
      else stat("Verbindung verloren.","bad");
    });
  }
  stat("Verbinde … Kopplung bestätigen (000000)","warn");
  const got=await connectDevice();
  if(!got.length){ stat("Kein Zugriff. 000000 / 123456 eingeben, dann nochmal.","bad"); return }
  attach(got);
  stat("Verbunden. Scannen.","ok");
  if(pending){ const p=pending; pending=null; log("Nachgeholter QR: "+p); unlock(true) }
  else startCam();
}
$("#go").onclick=async()=>{
  if(chans.length){ startCam(); return }
  if(dev&&dev.gatt){ const got=await connectDevice(); if(got.length){ attach(got); startCam(); return } }
  startLink();
};

/* ---------- BLE-Kette ---------- */
async function bleChain(deep){
  for(let r=1;r<=5;r++){
    stat("Kette "+r+"/5 …","warn");
    if(await fullSeq(UNLOCK,c=>c,DLY())){
      await fullSeq(UNLOCK,c=>c,Math.max(300,DLY()/2));
      return true;
    }
    await wait(900);
  }
  for(let pass=1;pass<=3;pass++){
    for(let f=1;f<FRAMES.length;f++){
      stat("Variante "+f+"/4 · Runde "+pass,"warn");
      if(await fullSeq(UNLOCK,FRAMES[f],DLY())){ await fullSeq(UNLOCK,FRAMES[f],300); return true }
      await wait(450);
    }
    if(chans.length>1){ ci=(ci+1)%chans.length; log("Kanal → "+chans[ci].uuid.slice(4,8)) }
  }
  stat("Befehlssatz …","warn");
  for(const c of VOCAB){ await write(c,x=>x); await wait(800); if(acks) return true }
  for(const f of [1,2,4]){
    if(await fullSeq(VOCAB.join(","),FRAMES[f],600)) return true;
    if(chans.length>1) ci=(ci+1)%chans.length;
  }
  if(deep){
    stat("Neu verbinden und wiederholen …","warn");
    try{ if(dev.gatt.connected) dev.gatt.disconnect() }catch(_){}
    await wait(1000);
    const got=await connectDevice();
    if(got.length){ attach(got); for(const f of [0,1,2,3,4]){ if(await fullSeq(UNLOCK,FRAMES[f],DLY())) return true } }
  }
  return false;
}

/* ---------- Server ---------- */
async function nearest(){
  const g=await geo(), d=0.0018;
  const r=await api(`${BASE}/v2/map/bike_pins?ne_lat=${g.lat+d}&ne_lng=${g.lng+d}&sw_lat=${g.lat-d}&sw_lng=${g.lng-d}&user_latitude=${g.lat}&user_longitude=${g.lng}&zoom=18`,{headers:H()});
  const raw=(r.data&&r.data.data)||{};
  const pins=raw.bikes||(raw.attributes&&raw.attributes.bikes)||[];
  return pins.map(p=>p.attributes||p)
    .filter(v=>(v.id||v.vehicle_id)&&!v.is_reserved&&!v.is_disabled)
    .sort((a,b)=>(a.distance||0)-(b.distance||0))
    .map(v=>v.id||v.vehicle_id);
}
async function reserve(){
  if(!online()) throw new Error("kein Netz");
  if(!get("lime","")) await makeAccount();
  if(!get("lime","")) throw new Error("kein Konto");
  const ids=await nearest();
  if(!ids.length) throw new Error("kein freier Roller in Reichweite");
  const id=ids[0];
  const tries=[
    [`${BASE}/v1/bikes/${id}/reserve`,{id}],
    [`${BASE}/v2/frontend/vehicles/reserve`,{vehicle_id:id}],
    [`${BASE}/v1/rides/reserve`,{bike_id:id}]
  ];
  for(const [url,body] of tries){
    const r=await api(url,{method:"POST",headers:H(),body});
    log("reserve → "+r.status);
    if(r.status<400){ reserved=id; $("#accLog").textContent="Reserviert: "+id; return id }
  }
  throw new Error("Reservieren abgelehnt");
}
async function unreserve(){
  if(!reserved) return;
  for(const url of [
    `${BASE}/v1/bikes/${reserved}/reserve/cancel`,
    `${BASE}/v1/bikes/${reserved}/reserve`
  ]){
    const r=await api(url,{method:"POST",headers:H(),body:{id:reserved}});
    if(r.status<400){ log("Reservierung aufgehoben"); break }
  }
  reserved=null;
}

/* ---------- Entsperren ---------- */
async function unlock(deep){
  if(busy) return;
  if(!chans.length){ pending=last; startLink(); return }
  busy=true; ui(); acks=0;
  try{
    if(await bleChain(deep)) return done("Roller hat geantwortet. Kickstart!");

    if(online()){
      stat("Reservieren und erneut versuchen …","warn");
      try{
        await reserve();
        log("Reserviert — zweiter Durchgang");
        if(await bleChain(false)) return done("Über Reservierung entsperrt. Kickstart!");
      }catch(e){ log("Reserve: "+err(e)) }

      if(!onlyFree()&&get("lime","")){
        stat("Serverfahrt versuchen …","warn");
        const b=await refreshBalance();
        log("Guthaben: "+(b===null?"unbekannt":(b/100).toFixed(2)+" €"));
        try{
          const r=await rentAny();
          ride={server:true,id:r.id};
          return done("Über Server entsperrt — "+(b&&b>0?"aus Guthaben":"ohne Guthaben"));
        }catch(e){ log("Server: "+err(e)); stat(translate(err(e)),"bad") }
      }
    }
    done(onlyFree()?"Alles probiert (Nur-kostenlos aktiv). Anderer Roller.":"Alles probiert. Anderer Roller.","warn");
  }catch(e){ stat(err(e),"bad"); log("FEHLER: "+err(e)); busy=false; ui() }
}
function done(msg,cls){
  busy=false; ride=ride||{}; startTimer(); ui(); stat(msg,cls||"ok");
}
function translate(t){
  const s=String(t).toLowerCase();
  if(/payment|card|method/.test(s)) return "Lime verlangt ein Zahlungsmittel im Konto.";
  if(/insufficient|balance/.test(s)) return "Guthaben reicht nicht.";
  if(/reserved|in_use|rented/.test(s)) return "Roller ist belegt — nächster.";
  if(/distance|too_far/.test(s)) return "Roller zu weit weg.";
  return "Server: "+t;
}

$("#again").onclick=()=>unlock(true);
$("#lock").onclick=async()=>{
  if(busy||(!chans.length&&!ride)) return;
  busy=true; ui();
  try{
    if(ride&&ride.server){
      await api(`${BASE}/v1/bikes/${ride.id}/end`,{method:"POST",headers:H(),body:{id:ride.id}});
      log("Server-Fahrt beendet.");
    }
    await fullSeq("KS,L0",c=>c,300);
    await write("L0",c=>c);
    stat("Gesperrt.","ok");
  }catch(e){ stat("Sperren: "+err(e),"bad") }
  ride=null; clearInterval(tick); tick=null; busy=false; ui();
};
$("#lon").onclick=()=>{ if(!chans.length) return; acks=0; write("L1",c=>c); stat("Licht an gesendet.","warn") };
$("#loff").onclick=()=>{ if(!chans.length) return; acks=0; write("L0",c=>c); stat("Licht aus gesendet.","warn") };

/* ---------- Konto ---------- */
async function makeAccount(){
  const L=$("#accLog");
  try{
    const r=await api(MAIL+"?action=genRandomMailbox&count=1");
    const addr=Array.isArray(r.data)?r.data[0]:null; if(!addr) throw new Error("keine Adresse");
    set("email",addr); L.textContent="Adresse: "+addr;
    await api(`${BASE}/v2/onboarding/magic-link`,{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:{email:addr,user_agreement_country_code:"DE",user_agreement_version:4}});
    L.textContent+="\nwarte auf Mail …";
    const [login,domain]=addr.split("@"); let link=null;
    for(let i=0;i<18&&!link;i++){
      await wait(3000);
      const m=await api(`${MAIL}?action=getMessages&login=${login}&domain=${domain}`);
      if(!Array.isArray(m.data)||!m.data.length) continue;
      const t=await api(`${MAIL}?action=readMessage&login=${login}&domain=${domain}&id=${m.data[0].id}`);
      const b=(t.data&&(t.data.body||t.data.textBody))||"";
      const h=b.match(/https?:\/\/[^\s"'<>]*token=[^\s"'<>]*/); if(h) link=h[0];
    }
    if(!link){ L.textContent+="\nkeine Mail"; return }
    const tok=decodeURIComponent((link.match(/[?&]token=([^&\s]+)/)||[])[1]||link);
    const d=get("dev","")||uuid(); set("dev",d);
    const l=await api(`${BASE}/v2/onboarding/login`,{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded","x-device-token":d},body:{magic_link_token:tok}});
    const tk=l.data&&(l.data.token||(l.data.data&&l.data.data.token));
    if(tk){ set("lime",tk); L.textContent+="\nKonto aktiv."; ui() } else L.textContent+="\nfehlgeschlagen";
  }catch(e){ L.textContent+="\n"+err(e) }
}
async function refreshBalance(){
  if(!get("lime","")) return null;
  for(const p of ["/v1/views/rider_summary","/v1/wallets"]){
    try{
      const r=await api(BASE+p,{headers:H()});
      const m=JSON.stringify(r.data).match(/"balance_cents":(-?\d+)/);
      if(m){ const v=parseInt(m[1],10); $("#bal").textContent=(v/100).toFixed(2).replace(".",",")+" €"; return v }
    }catch(_){}
  }
  $("#bal").textContent="?";
  return null;
}
async function rentAny(){
  const ids=(await nearest()).slice(0,3);
  if(!ids.length) throw new Error("kein freier Roller in Reichweite");
  let lastErr="";
  for(const id of ids){
    log("rent "+id);
    const r=await api(`${BASE}/v1/bikes/${id}/rent`,{method:"POST",headers:H(),body:{id}});
    if(r.status<400) return {id};
    lastErr=JSON.stringify(r.data).slice(0,140);
    log("abgelehnt: "+lastErr);
    await wait(500);
  }
  throw new Error(lastErr||"abgelehnt");
}

/* ---------- Kamera ---------- */
async function startCam(){
  if(stream) return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});
    vid.srcObject=stream; await vid.play(); $("#camBox").classList.add("on"); raf=requestAnimationFrame(scan);
  }catch(e){ stat("Kamera: "+err(e),"bad") }
}
function stopCam(){ if(raf)cancelAnimationFrame(raf),raf=null; if(stream){stream.getTracks().forEach(t=>t.stop());stream=null} $("#camBox").classList.remove("on") }
function scan(){
  if(!stream) return;
  if(vid.readyState===4){
    cv.width=vid.videoWidth; cv.height=vid.videoHeight;
    ctx.drawImage(vid,0,0,cv.width,cv.height);
    const d=ctx.getImageData(0,0,cv.width,cv.height);
    const r=window.jsQR?jsQR(d.data,d.width,d.height,{inversionAttempts:"dontInvert"}):null;
    if(r&&r.data){
      const n=Date.now();
      if(r.data===last&&n-lastT<3000){ raf=requestAnimationFrame(scan); return }
      last=r.data; lastT=n; stopCam(); log("QR: "+r.data); unlock(true); return;
    }
  }
  raf=requestAnimationFrame(scan);
}

function startTimer(){
  clearInterval(tick); t0=Date.now();
  tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);
    $("#timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000);
}

$("#cancel").onclick=async()=>{ try{ busy=true;ui(); await unreserve(); stat("Aufgehoben.","ok") }catch(e){ stat(err(e),"bad") } finally{ busy=false;ui() } };
